<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized CTR lift chart</title>
  <desc id="desc">An indexed before and after chart showing CTR rising from 100 to 125 after structured testing.</desc>
  <rect width="960" height="520" fill="#f8f1e4"/>
  <rect x="40" y="38" width="880" height="444" fill="#fbf7ef" stroke="#d7cbbb" stroke-width="2"/>
  <text x="78" y="92" fill="#1d1b18" font-family="Georgia, serif" font-size="36" letter-spacing="-1">Creative testing made performance visible</text>
  <text x="78" y="126" fill="#786f66" font-family="Arial, sans-serif" font-size="17">Indexed CTR movement, anonymized and rounded</text>

  <g transform="translate(140 176)">
    <line x1="0" y1="230" x2="650" y2="230" stroke="#d2c4b2" stroke-width="2"/>
    <g stroke="#e6dccd" stroke-width="1">
      <line x1="0" y1="184" x2="650" y2="184"/>
      <line x1="0" y1="138" x2="650" y2="138"/>
      <line x1="0" y1="92" x2="650" y2="92"/>
      <line x1="0" y1="46" x2="650" y2="46"/>
    </g>
    <rect x="128" y="92" width="128" height="138" fill="#d9e2ec" stroke="#213f63" stroke-width="2"/>
    <rect x="394" y="58" width="128" height="172" fill="#ead8c0" stroke="#a8753e" stroke-width="2"/>
    <text x="155" y="82" fill="#213f63" font-family="Arial, sans-serif" font-size="22" font-weight="700">100</text>
    <text x="421" y="48" fill="#a8753e" font-family="Arial, sans-serif" font-size="22" font-weight="700">125</text>
    <text x="133" y="270" fill="#786f66" font-family="Arial, sans-serif" font-size="17">Before</text>
    <text x="383" y="270" fill="#786f66" font-family="Arial, sans-serif" font-size="17">After testing</text>
    <path d="M258 86 C310 44 356 34 392 48" fill="none" stroke="#a33a31" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="300" y="28" fill="#a33a31" font-family="Arial, sans-serif" font-size="20" font-weight="700">+25%</text>
  </g>

  <text x="78" y="448" fill="#786f66" font-family="Arial, sans-serif" font-size="16">No client figures shown. Baseline indexed to 100 to show direction and scale.</text>
</svg>
