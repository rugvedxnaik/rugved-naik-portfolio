<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Identity Value x Object Value framework</title>
  <desc id="desc">A two by two framework separates object value from identity value and places the Miutine signal in the collectible object territory.</desc>
  <rect width="1200" height="820" fill="#f8f1e4"/>
  <rect x="46" y="46" width="1108" height="728" fill="#fbf7ef" stroke="#d7cbbb" stroke-width="2"/>
  <text x="86" y="104" fill="#1d1b18" font-family="Georgia, serif" font-size="44" letter-spacing="-1">Identity Value x Object Value</text>
  <text x="86" y="140" fill="#786f66" font-family="Arial, sans-serif" font-size="18">Framework visual from review mining, competitive reading and social listening</text>

  <g transform="translate(170 205)">
    <rect x="0" y="0" width="780" height="460" fill="#fffaf1" stroke="#dfd4c4"/>
    <line x1="390" y1="0" x2="390" y2="460" stroke="#d2c4b2" stroke-width="2"/>
    <line x1="0" y1="230" x2="780" y2="230" stroke="#d2c4b2" stroke-width="2"/>

    <text x="32" y="62" fill="#786f66" font-family="Arial, sans-serif" font-size="20">Signature loyalty</text>
    <text x="32" y="90" fill="#9b8e82" font-family="Arial, sans-serif" font-size="15">same scent, repeated self story</text>

    <text x="432" y="62" fill="#786f66" font-family="Arial, sans-serif" font-size="20">Collectible identity</text>
    <text x="432" y="90" fill="#9b8e82" font-family="Arial, sans-serif" font-size="15">range, display, curation and self expression</text>

    <text x="32" y="292" fill="#786f66" font-family="Arial, sans-serif" font-size="20">Utility refill</text>
    <text x="32" y="320" fill="#9b8e82" font-family="Arial, sans-serif" font-size="15">satisfaction, habit and convenience</text>

    <text x="432" y="292" fill="#786f66" font-family="Arial, sans-serif" font-size="20">Display object</text>
    <text x="432" y="320" fill="#9b8e82" font-family="Arial, sans-serif" font-size="15">bottle, shelf, packaging and ownership</text>

    <circle cx="590" cy="284" r="17" fill="#a33a31"/>
    <circle cx="590" cy="284" r="38" fill="none" stroke="#a33a31" stroke-width="2" opacity="0.38"/>
    <text x="620" y="279" fill="#1d1b18" font-family="Arial, sans-serif" font-size="18" font-weight="700">Miutine signal</text>
    <text x="620" y="305" fill="#786f66" font-family="Arial, sans-serif" font-size="15">high object value, weaker identity language</text>

    <path d="M602 270 C650 226 668 156 660 104" fill="none" stroke="#a8753e" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="674" y="126" fill="#a8753e" font-family="Arial, sans-serif" font-size="16">strategic move</text>
    <text x="674" y="148" fill="#a8753e" font-family="Arial, sans-serif" font-size="16">connect collection to identity</text>

    <text x="300" y="510" fill="#786f66" font-family="Arial, sans-serif" font-size="17">Object Value</text>
    <text x="-112" y="238" fill="#786f66" font-family="Arial, sans-serif" font-size="17" transform="rotate(-90 -112 238)">Identity Value</text>
    <text x="0" y="500" fill="#9b8e82" font-family="Arial, sans-serif" font-size="14">low</text>
    <text x="748" y="500" fill="#9b8e82" font-family="Arial, sans-serif" font-size="14">high</text>
    <text x="-48" y="458" fill="#9b8e82" font-family="Arial, sans-serif" font-size="14">low</text>
    <text x="-54" y="12" fill="#9b8e82" font-family="Arial, sans-serif" font-size="14">high</text>
  </g>

  <text x="86" y="735" fill="#786f66" font-family="Arial, sans-serif" font-size="17">Use: separate collectors from loyalists before deciding retention, drops, CRM and positioning.</text>
</svg>
