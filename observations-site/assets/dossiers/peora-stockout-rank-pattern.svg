<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized stock-out and organic rank pattern</title>
  <desc id="desc">Two indexed lines show inventory availability falling first, then organic rank falling shortly after.</desc>
  <rect width="1200" height="720" fill="#f8f1e4"/>
  <rect x="42" y="42" width="1116" height="636" fill="#fbf7ef" stroke="#d7cbbb" stroke-width="2"/>
  <text x="82" y="92" fill="#1d1b18" font-family="Georgia, serif" font-size="44" letter-spacing="-1">Availability is a ranking signal</text>
  <text x="82" y="128" fill="#786f66" font-family="Arial, sans-serif" font-size="18">Anonymized marketplace dashboard pattern, indexed values only</text>

  <g transform="translate(110 170)">
    <rect x="0" y="0" width="900" height="390" fill="#fffaf1" stroke="#dfd4c4"/>
    <g stroke="#e6dccd" stroke-width="1">
      <line x1="0" y1="65" x2="900" y2="65"/>
      <line x1="0" y1="130" x2="900" y2="130"/>
      <line x1="0" y1="195" x2="900" y2="195"/>
      <line x1="0" y1="260" x2="900" y2="260"/>
      <line x1="0" y1="325" x2="900" y2="325"/>
      <line x1="128" y1="0" x2="128" y2="390"/>
      <line x1="256" y1="0" x2="256" y2="390"/>
      <line x1="384" y1="0" x2="384" y2="390"/>
      <line x1="512" y1="0" x2="512" y2="390"/>
      <line x1="640" y1="0" x2="640" y2="390"/>
      <line x1="768" y1="0" x2="768" y2="390"/>
    </g>

    <rect x="488" y="0" width="92" height="390" fill="#a33a31" opacity="0.06"/>
    <text x="502" y="24" fill="#a33a31" font-family="Arial, sans-serif" font-size="14" font-weight="700">stock-out</text>

    <polyline points="0,39 128,47 256,72 384,160 512,355 640,238 768,91 900,55" fill="none" stroke="#213f63" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,32 128,35 256,46 384,86 512,174 640,285 768,235 900,178" fill="none" stroke="#a33a31" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#213f63">
      <circle cx="0" cy="39" r="6"/>
      <circle cx="128" cy="47" r="6"/>
      <circle cx="256" cy="72" r="6"/>
      <circle cx="384" cy="160" r="6"/>
      <circle cx="512" cy="355" r="6"/>
      <circle cx="640" cy="238" r="6"/>
      <circle cx="768" cy="91" r="6"/>
      <circle cx="900" cy="55" r="6"/>
    </g>
    <g fill="#a33a31">
      <circle cx="0" cy="32" r="6"/>
      <circle cx="128" cy="35" r="6"/>
      <circle cx="256" cy="46" r="6"/>
      <circle cx="384" cy="86" r="6"/>
      <circle cx="512" cy="174" r="6"/>
      <circle cx="640" cy="285" r="6"/>
      <circle cx="768" cy="235" r="6"/>
      <circle cx="900" cy="178" r="6"/>
    </g>

    <g fill="#786f66" font-family="Arial, sans-serif" font-size="15">
      <text x="-54" y="8">100</text>
      <text x="-44" y="333">0</text>
      <text x="912" y="8">100</text>
      <text x="912" y="333">0</text>
      <text x="-18" y="424">W1</text>
      <text x="112" y="424">W2</text>
      <text x="240" y="424">W3</text>
      <text x="368" y="424">W4</text>
      <text x="496" y="424">W5</text>
      <text x="624" y="424">W6</text>
      <text x="752" y="424">W7</text>
      <text x="882" y="424">W8</text>
    </g>

    <g font-family="Arial, sans-serif" font-size="17">
      <circle cx="0" cy="462" r="7" fill="#213f63"/>
      <text x="18" y="468" fill="#213f63">Inventory availability index</text>
      <circle cx="284" cy="462" r="7" fill="#a33a31"/>
      <text x="302" y="468" fill="#a33a31">Organic rank index, lagged decline</text>
    </g>

    <path d="M590 180 C644 184 658 236 640 285" fill="none" stroke="#a8753e" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="610" y="166" fill="#a8753e" font-family="Arial, sans-serif" font-size="17">rank damage appears after availability loss</text>
  </g>

  <text x="82" y="640" fill="#786f66" font-family="Arial, sans-serif" font-size="17">No confidential figures shown. Values are indexed to make the operating pattern visible.</text>
</svg>
